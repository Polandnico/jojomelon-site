name: IndexNow

# The site is published by GitHub Pages directly from main, so there is no
# deploy workflow to hook. Wait for Pages to publish the key file, then submit
# the sitemap URLs.
on:
  push:
    branches:
      - main

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for GitHub Pages
        run: sleep 120

      - name: Submit sitemap URLs to IndexNow
        run: bash scripts/indexnow.sh
